version: "3.8"

services:
  # =========================
  # PostgreSQL Database
  # =========================
  postgres:
    image: postgres:16
    container_name: qr_postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: qrcode-order
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - qr_network

  # =========================
  # Redis Cache
  # =========================
  redis:
    image: redis:7.2
    container_name: qr_redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - qr_network
    volumes:
      - redis_data:/data

  # =========================
  # MinIO Storage
  # =========================
  minio:
    image: minio/minio:latest
    container_name: qr_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO API
      - "9001:9001" # MinIO Console
    volumes:
      - minio_data:/data
    networks:
      - qr_network

# =========================
# Volumes & Networks
# =========================
volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  qr_network:
    driver: bridge
